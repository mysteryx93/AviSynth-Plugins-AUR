name: Publish
# Dispatch: optional Release (draft by default) then AUR. Tick draft off to publish.
# Monday cron: published Release + AUR. Does not compile unless you tick compile (or cron).
# Build never creates a Release. Push to this repo does not publish.

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Package ids (all or comma-separated catalog ids)
        required: false
        default: all
        type: string
      pkgrel:
        description: AUR pkgrel
        required: false
        default: "1"
        type: string
      force:
        description: Publish even if pkgver already matches upstream
        required: false
        default: false
        type: boolean
      compile:
        description: Compile in this run. Off = tarballs from a Build run (test first).
        required: false
        default: false
        type: boolean
      build_run_id:
        description: Build run ID to reuse (empty = latest successful Build on this branch)
        required: false
        default: ""
        type: string
      create_release:
        description: Create or update a GitHub Release from the tarballs
        required: false
        default: true
        type: boolean
      draft:
        description: Draft Release (testing). Off = publish the Release. Draft skips AUR. Cron always publishes.
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "17 6 * * 1"

concurrency:
  group: publish-aur-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      has_packages: ${{ steps.meta.outputs.has_packages }}
      has_builds: ${{ steps.meta.outputs.has_builds }}
      compile: ${{ steps.flags.outputs.compile }}
      create_release: ${{ steps.flags.outputs.create_release }}
      draft: ${{ steps.flags.outputs.draft }}
      build_matrix: ${{ steps.meta.outputs.build_matrix }}
      release_matrix: ${{ steps.meta.outputs.release_matrix }}
      aur_matrix: ${{ steps.meta.outputs.aur_matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Resolve versions
        id: meta
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGES: ${{ github.event.inputs.packages || 'all' }}
        run: |
          set -euo pipefail
          extra=()
          if [[ '${{ github.event_name }}' == 'schedule' ]]; then
            extra+=(--skip-unchanged)
          fi
          if [[ '${{ github.event.inputs.force || false }}' == 'true' ]]; then
            extra+=(--force)
          fi
          python3 -m unittest discover -s tests
          python3 scripts/catalog.py --packages "$PACKAGES" resolve "${extra[@]}" --github-output
      - id: flags
        run: |
          set -euo pipefail
          if [[ '${{ github.event_name }}' == 'schedule' ]]; then
            echo "compile=true" >> "$GITHUB_OUTPUT"
            echo "create_release=true" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          else
            echo "compile=${{ github.event.inputs.compile == 'true' }}" >> "$GITHUB_OUTPUT"
            echo "create_release=${{ github.event.inputs.create_release != 'false' }}" >> "$GITHUB_OUTPUT"
            echo "draft=${{ github.event.inputs.draft != 'false' }}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    if: >-
      needs.prepare.outputs.has_builds == 'true'
      && needs.prepare.outputs.compile == 'true'
      && needs.prepare.outputs.create_release == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build (Arch container)
        if: matrix.distro == 'arch'
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD":/work -w /work \
            archlinux:base-devel \
            bash -lc "bash scripts/build-package.sh '${{ matrix.id }}' arch '${{ matrix.version }}'"

      - name: Build (Ubuntu / portable)
        if: matrix.distro != 'arch'
        run: |
          set -euo pipefail
          scripts/build-package.sh '${{ matrix.id }}' '${{ matrix.distro }}' '${{ matrix.version }}'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-${{ matrix.distro }}
          path: out/*.tar.zst
          if-no-files-found: error

  find-build:
    needs: prepare
    if: >-
      needs.prepare.outputs.has_builds == 'true'
      && needs.prepare.outputs.compile != 'true'
      && needs.prepare.outputs.create_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.run.outputs.run_id }}
    steps:
      - name: Resolve Build run
        id: run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED: ${{ github.event.inputs.build_run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ -n "${REQUESTED:-}" ]]; then
            echo "run_id=$REQUESTED" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          id=$(gh run list --workflow Build --branch "$BRANCH" --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId // empty')
          [[ -n "$id" ]] || {
            echo "::error::No successful Build on $BRANCH. Run Build first, or tick compile."
            exit 1
          }
          echo "Reusing Build run $id"
          echo "run_id=$id" >> "$GITHUB_OUTPUT"

  reuse:
    needs: [prepare, find-build]
    if: >-
      needs.prepare.outputs.has_builds == 'true'
      && needs.prepare.outputs.compile != 'true'
      && needs.prepare.outputs.create_release == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Download artifact from Build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ needs.find-build.outputs.run_id }}
          NAME: ${{ matrix.id }}-${{ matrix.distro }}
        run: |
          set -euo pipefail
          mkdir -p out
          gh run download "$RUN_ID" -n "$NAME" -D out
          shopt -s nullglob
          files=(out/*.tar.zst out/**/*.tar.zst)
          (( ${#files[@]} > 0 )) || {
            echo "::error::Build run $RUN_ID has no artifact $NAME"
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}-${{ matrix.distro }}
          path: out/**/*.tar.zst
          if-no-files-found: error

  release:
    needs: [prepare, build, reuse]
    if: >-
      always()
      && needs.prepare.outputs.create_release == 'true'
      && needs.prepare.outputs.has_builds == 'true'
      && (needs.build.result == 'success' || needs.reuse.result == 'success')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.release_matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.id }}-*
          path: dist
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ matrix.release_tag }}
          TITLE: ${{ matrix.aur }} ${{ matrix.version }}
          DRAFT: ${{ needs.prepare.outputs.draft }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(dist/*.tar.zst)
          (( ${#files[@]} > 0 )) || { echo "::error::No tarballs for ${{ matrix.id }}"; exit 1; }
          extra=()
          [[ "$DRAFT" == true ]] && extra+=(--draft)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Replaces assets under the same tag. Prefer a pkgrel/tarball rename on retry.
            gh release upload "$TAG" "${files[@]}" --clobber
            # Never turn a published Release back into a draft.
            if [[ "$DRAFT" != true ]]; then
              gh release edit "$TAG" --draft=false
            fi
          else
            gh release create "$TAG" "${files[@]}" --target '${{ github.sha }}' --title "$TITLE" \
              --notes "Automated build of ${{ matrix.aur }} ${{ matrix.version }}." "${extra[@]}"
          fi

  # After Release: -bin PKGBUILDs fetch the Arch tarball from that tag.
  # Source AUR packages are not makepkg-tested here (that recompiles). Test via Build.
  aur:
    needs: [prepare, build, reuse, release]
    if: >-
      always()
      && needs.prepare.outputs.draft != 'true'
      && needs.prepare.outputs.has_packages == 'true'
      && (needs.build.result == 'success' || needs.build.result == 'skipped')
      && (needs.reuse.result == 'success' || needs.reuse.result == 'skipped')
      && (needs.release.result == 'success' || needs.release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.aur_matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Bump PKGBUILD version
        env:
          PKGREL: ${{ github.event.inputs.pkgrel || '1' }}
        run: |
          set -euo pipefail
          scripts/bump-pkgver.sh "packages/${{ matrix.aur }}/PKGBUILD" "${{ matrix.version }}" "$PKGREL"

      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.2.0
        with:
          pkgname: ${{ matrix.aur }}
          pkgbuild: ./packages/${{ matrix.aur }}/PKGBUILD
          updpkgsums: true
          test: ${{ matrix.kind != 'source' }}
          commit_username: ${{ secrets.AUR_USERNAME || 'Hanuman' }}
          commit_email: ${{ secrets.AUR_EMAIL || 'mysteryx93@protonmail.com' }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: Update ${{ matrix.aur }} to ${{ matrix.version }}
          ssh_keyscan_types: rsa,ecdsa,ed25519
