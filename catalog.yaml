defaults:
  maintainer: "Etienne Charland <mysteryx93 at protonmail dot com>"
  aur_username: Hanuman
  arch: x86_64
  distros: [arch, ubuntu22.04]
  github_repo: mysteryx93/AviSynth-Plugins-AUR

packages:
  - id: rife-asdg
    aur: avisynth-plugin-rife-asdg-bin
    kind: bin
    host: avisynth
    author: asdg
    repo: https://github.com/Asd-g/AviSynthPlus-RIFE
    license: MIT
    version_from: release
    pkgdesc: "AviSynth+ RIFE frame interpolation (Asd-g, ncnn Vulkan) — prebuilt"
    depends: [avisynthplus, vulkan-icd-loader]
    makedepends:
      arch: [cmake, ninja, git, vulkan-headers, glslang, avisynthplus]
      ubuntu: [ninja-build, git, libvulkan-dev, glslang-dev, pkg-config, g++]
    submodules: true
    needs_avisynth_headers: true
    needs_vulkan: true
    cmake_min: "3.28"
    build: |
      cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      cmake --build build
    collect:
      - glob: build/librife*.so
        dest_dir: usr/lib/avisynth
    install_hint: Copy the .so into /usr/lib/avisynth/ (AviSynth+ autoload). Models are not included; pass model_path or install avisynth-plugin-rife-asdg-models when it exists.

  - id: mvtools2-pinterf
    aur: avisynth-plugin-mvtools2-pinterf
    kind: source
    host: avisynth
    author: pinterf
    repo: https://github.com/pinterf/mvtools
    license: GPL-2.0-only
    version_from: tag
    pkgdesc: "AviSynth+ MVTools2 (pinterf) — motion estimation and compensation"
    depends: [avisynthplus, fftw]
    makedepends:
      arch: [cmake, avisynthplus, fftw]
      ubuntu: [cmake, g++, pkg-config, libfftw3-dev]
    needs_avisynth_headers: true
    build: |
      rm -rf Sources/include DePan/include DePanEstimate/include
      export CXXFLAGS="${CXXFLAGS:-} $(pkg-config --cflags avisynth)"
      cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
      cmake --build build
      DESTDIR="${PWD}/stage" cmake --install build
    collect:
      - glob: stage/usr/lib/avisynth/*.so
        dest_dir: usr/lib/avisynth
    install_hint: Copy the .so files into /usr/lib/avisynth/. On Arch, prefer the AUR source package avisynth-plugin-mvtools2-pinterf.

  - id: xclean-avs
    aur: avisynth-plugin-xclean
    kind: script
    host: avisynth
    author: mysteryx93
    repo: https://github.com/mysteryx93/xClean
    license: GPL-3.0-only
    version_from: manual
    version: "0.10"
    pkgdesc: "AviSynth xClean 3-pass denoiser (AVSI)"
    depends: [avisynthplus]
    files:
      - src: xClean.avsi
        dest: usr/lib/avisynth/xClean.avsi
    install_hint: Copy xClean.avsi into /usr/lib/avisynth/. Runtime plugins (MaskTools2, MVTools2, KNLMeansCL, BM3D, …) are not bundled.
