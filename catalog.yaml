defaults:
  maintainer: "Etienne Charland <mysteryx93 at protonmail dot com>"
  aur_username: Hanuman
  arch: x86_64
  distros: [arch, ubuntu22.04]
  github_repo: mysteryx93/AviSynth-Plugins-AUR

# kind: source is required for compiled plugins. kind: bin is optional Arch convenience.
packages:
  - id: rife-asdg
    aur: avisynth-plugin-rife-asdg
    kind: source
    host: avisynth
    author: asdg
    repo: https://github.com/Asd-g/AviSynthPlus-RIFE
    license: MIT
    version_from: release
    pkgdesc: "AviSynth+ RIFE frame interpolation (Asd-g, ncnn Vulkan)"
    depends: [avisynthplus, vulkan-icd-loader]
    makedepends:
      # vulkan-icd-loader: FindVulkan needs libvulkan.so, not only headers.
      arch: [cmake, ninja, git, vulkan-headers, vulkan-icd-loader, glslang, avisynthplus]
      ubuntu: [ninja-build, git, libvulkan-dev, glslang-dev, pkg-config, g++]
    submodules: true
    needs_avisynth_headers: true
    cmake_min: "3.28"
    # plugin.cpp includes <format>; jammy g++ 11 / libstdc++ 12 do not have it.
    ubuntu_gcc: "13"
    build: |
      # Ubuntu GHA ~7GB OOMs on ncnn *avx512.cpp at full ninja -j. Arch CI already
      # succeeded with AVX512. RIFE inference is Vulkan; AVX512 is CPU fallback.
      extra=()
      jobs=()
      if [[ "${DISTRO:-}" == ubuntu22.04 ]]; then
        extra=(-DNCNN_AVX512=OFF -DNCNN_AVX512VNNI=OFF -DNCNN_AVX512BF16=OFF -DNCNN_AVX512FP16=OFF)
        extra+=(-DCMAKE_C_COMPILER="${CC:-gcc-13}" -DCMAKE_CXX_COMPILER="${CXX:-g++-13}")
        # g++-13 needs newer GLIBCXX than stock 22.04; keep the tarball loadable.
        extra+=(-DCMAKE_SHARED_LINKER_FLAGS=-static-libstdc++)
        jobs=(--parallel 2)
      fi
      cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "${extra[@]}"
      cmake --build build "${jobs[@]}"
    collect:
      - glob: build/librife*.so
        dest_dir: usr/lib/avisynth
    files:
      - src: LICENSE
        dest: usr/share/licenses/avisynth-plugin-rife-asdg/LICENSE
    install_hint: /usr/lib/avisynth/. Models not included.

  - id: rife-asdg-bin
    aur: avisynth-plugin-rife-asdg-bin
    kind: bin
    binary_of: rife-asdg
    host: avisynth
    author: asdg
    repo: https://github.com/Asd-g/AviSynthPlus-RIFE
    license: MIT
    version_from: release
    pkgdesc: "AviSynth+ RIFE frame interpolation (Asd-g, ncnn Vulkan) — prebuilt"
    depends: [avisynthplus, vulkan-icd-loader]

  - id: mvtools2-pinterf
    aur: avisynth-plugin-mvtools2-pinterf
    kind: source
    host: avisynth
    author: pinterf
    repo: https://github.com/pinterf/mvtools
    license: GPL-2.0-only
    version_from: tag
    pkgdesc: "AviSynth+ MVTools2 (pinterf) — motion estimation and compensation"
    depends: [avisynthplus, fftw]
    makedepends:
      arch: [cmake, fftw]
      ubuntu: [cmake, g++, libfftw3-dev]
    # Vendored headers are v12; distro avisynthplus 3.7.5 is v11.
    needs_avisynth_headers: false
    build: |
      # CMAKE_INSTALL_LIBDIR=lib: Ubuntu otherwise uses lib/x86_64-linux-gnu.
      cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DCMAKE_INSTALL_LIBDIR=lib
      cmake --build build
      DESTDIR="${PWD}/stage" cmake --install build
    collect:
      - glob: stage/usr/lib/avisynth/*.so
        dest_dir: usr/lib/avisynth
    files:
      - src: README.md
        dest: usr/share/doc/avisynth-plugin-mvtools2-pinterf/README.md
    install_hint: /usr/lib/avisynth/.

  - id: mvtools2-pinterf-bin
    aur: avisynth-plugin-mvtools2-pinterf-bin
    kind: bin
    binary_of: mvtools2-pinterf
    host: avisynth
    author: pinterf
    repo: https://github.com/pinterf/mvtools
    license: GPL-2.0-only
    version_from: tag
    pkgdesc: "AviSynth+ MVTools2 (pinterf) — prebuilt"
    depends: [avisynthplus, fftw]

  - id: xclean-avs
    aur: avisynth-plugin-xclean
    kind: script
    host: avisynth
    author: mysteryx93
    repo: https://github.com/mysteryx93/xClean
    license: GPL-3.0-only
    version_from: manual
    version: "0.10"
    pkgdesc: "AviSynth xClean 3-pass denoiser (AVSI)"
    depends: [avisynthplus]
    files:
      - src: xClean.avsi
        dest: usr/lib/avisynth/xClean.avsi
    install_hint: /usr/lib/avisynth/. Runtime plugins not bundled.
